[project]
name = "comfyui-model-hub"
version = "0.1.6"
description = "Manage and download models with SD Model Hub inside ComfyUI."
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }

[project.urls]
Repository = "https://github.com/licyk/comfyui-model-hub"

[tool.comfy]
PublisherId = "licyk"
DisplayName = "ComfyUI Model Hub"
Icon = ""

[tool.ruff]
line-length = 140
target-version = "py310"
lint.select = ["E4", "E7", "E9", "F", "I"]

[tool.ty.environment]
python-version = "3.10"
extra-paths = ["../ComfyUI"]

[tool.ty.src]
include = ["comfyui_model_hub", "prestartup_script.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
